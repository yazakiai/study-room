<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D自習室 - 入退室管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 常時表示バー: ステータス + 3ボタン -->
  <div class="bg-white border-b border-slate-200 shadow-sm z-10 shrink-0">
    <div class="max-w-md mx-auto p-3 sm:p-4">
      <div class="flex items-center justify-between mb-2.5">
        <h1 class="text-sm font-bold text-slate-900 tracking-tight">3D自習室 入退室受付</h1>
        <div id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold bg-slate-200 text-slate-600 shrink-0">
          <span class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span>未入室</span>
        </div>
      </div>
      <div id="userInfoLine" class="hidden text-xs font-medium text-slate-500 mb-2.5 -mt-1">
        <span id="displayName" class="font-bold text-slate-700">-</span>
        <span id="displaySubject" class="ml-1.5">-</span>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button id="btnEnter" onClick="handleEnter()" class="flex flex-col items-center justify-center gap-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-2.5 px-1 text-xs transition">
          <span class="text-base">▶</span>
          <span id="btnEnterText">入室する</span>
        </button>
        <button id="btnBreak" onClick="handleToggleBreak()" class="flex flex-col items-center justify-center gap-1 bg-slate-100 text-slate-300 border border-slate-200 font-bold py-2.5 px-1 text-xs cursor-not-allowed" disabled>
          <span class="text-base">☕</span>
          <span id="btnBreakText">休憩する</span>
        </button>
        <button id="btnLeave" onClick="handleLeave()" class="flex flex-col items-center justify-center gap-1 bg-slate-100 text-slate-300 border border-slate-200 font-bold py-2.5 px-1 text-xs cursor-not-allowed" disabled>
          <span class="text-base">⏹</span>
          <span>退室する</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 入室前: 名前・教科・座席の入力フォーム -->
  <div id="formView" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 p-6 sm:p-8 w-full max-w-md shadow-lg">
      <p class="text-xs text-slate-400 mb-5 text-center">学習を開始する際は、下の項目を入力してから上の「入室する」を押してください</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">ユーザーネーム <span class="text-rose-500">*</span></label>
          <input id="userName" type="text" placeholder="例: 山田 太郎" class="w-full bg-slate-50 border border-slate-300 px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:bg-white focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">学習教科 / 取り組み内容</label>
          <input id="userSubject" type="text" placeholder="例: 数学Ⅲ / 英語長文" class="w-full bg-slate-50 border border-slate-300 px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:bg-white focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">座席を選択 (全66席) <span class="text-rose-500">*</span></label>
          <select id="seatSelect" class="w-full bg-slate-50 border border-slate-300 px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:bg-white focus:border-indigo-500 transition font-bold">
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 入室後: 自分のキャラクターをカメラが追従する3Dビュー -->
  <div id="viewerView" class="hidden flex-1 relative bg-slate-900">
    <iframe id="roomViewer" class="w-full h-full border-0 block" title="3D自習室ビュー" allow="autoplay"></iframe>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDPmgyq3SjSEyPjWU5zVExSNvEEu4G7N54",
      authDomain: "my-study-room-b9d92.firebaseapp.com",
      databaseURL: "https://my-study-room-b9d92-default-rtdb.firebaseio.com",
      projectId: "my-study-room-b9d92",
      storageBucket: "my-study-room-b9d92.firebasestorage.app",
      messagingSenderId: "724467055397",
      appId: "1:724467055397:web:56df3a0f12a456c581f8cc",
      measurementId: "G-GJTCSZPZ82"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ↓↓↓ 3Dシミュレーター(StudyRoomApp)を実際にデプロイしているURLに書き換えてください ↓↓↓
    const STUDY_ROOM_3D_URL = "https://example.com/study-room-3d/";

    let userId = localStorage.getItem("study_room_uid");
    if (!userId) {
      userId = "user_" + Date.now();
      localStorage.setItem("study_room_uid", userId);
    }

    let isCooldown = false;
    let currentStatus = "LEFT";
    let allUsersData = {};

    // 3D側 (StudyRoomApp.jsx) の座席番号(0〜65)と一致させること:
    // 0-51 = 8デスク島・丸テーブルの座席, 52-59 = 左壁の個人学習スペース, 60-65 = 右壁の個人学習スペース
    const ISLANDS = [
      { name: "デスク A (左奥)", count: 8 }, { name: "デスク B (中央奥)", count: 8 },
      { name: "デスク C (右奥)", count: 8 }, { name: "デスク D (手前左)", count: 8 },
      { name: "デスク E (手前右)", count: 8 },
      { name: "丸テーブル 1 (左手前)", count: 4 }, { name: "丸テーブル 2 (中央)", count: 4 }, { name: "丸テーブル 3 (右手前)", count: 4 }
    ];
    const SEAT_NAMES = [];
    ISLANDS.forEach(island => {
      for (let i = 1; i <= island.count; i++) SEAT_NAMES.push(`${island.name} - ${i}番席`);
    });
    for (let i = 1; i <= 8; i++) SEAT_NAMES.push(`個人学習スペース (左壁) - ${i}番`);
    for (let i = 1; i <= 6; i++) SEAT_NAMES.push(`個人学習スペース (右壁) - ${i}番`);

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    db.ref("users").on("value", (snapshot) => {
      allUsersData = snapshot.val() || {};
      const myData = allUsersData[userId];

      if (myData) {
        if (myData.name) document.getElementById("userName").value = myData.name;
        if (myData.subject) document.getElementById("userSubject").value = myData.subject;
        currentStatus = myData.status || "LEFT";
        updateUI(currentStatus, myData.name, myData.subject);
      } else {
        currentStatus = "LEFT";
        updateUI("LEFT", "", "");
      }
      updateSeatDropdown(myData?.seatIndex);
    });

    function updateSeatDropdown(mySeatIndex) {
      const select = document.getElementById("seatSelect");
      const currentSelected = select.value !== "" ? parseInt(select.value) : mySeatIndex;
      select.innerHTML = "";

      const occupiedSeats = {};
      Object.entries(allUsersData).forEach(([uid, uData]) => {
        if (uid !== userId && ["ENTER_REQUEST", "SEATED", "BREAK"].includes(uData.status)) {
          if (uData.seatIndex !== undefined) occupiedSeats[uData.seatIndex] = uData.name || "他の学習者";
        }
      });

      let firstAvailable = -1;
      SEAT_NAMES.forEach((name, idx) => {
        const option = document.createElement("option");
        option.value = idx;
        if (occupiedSeats[idx]) {
          option.text = `❌ ${name} (${occupiedSeats[idx]}様 使用中)`;
          option.disabled = true;
        } else {
          option.text = `🪑 ${name}`;
          if (firstAvailable === -1) firstAvailable = idx;
        }
        if (currentSelected === idx) option.selected = true;
        select.appendChild(option);
      });

      if ((select.value === "" || select.options[select.selectedIndex]?.disabled) && firstAvailable !== -1) {
        select.value = firstAvailable;
      }
    }

    function triggerCooldown() {
      isCooldown = true;
      document.getElementById("btnEnter").disabled = true;
      document.getElementById("btnBreak").disabled = true;
      document.getElementById("btnLeave").disabled = true;
      setTimeout(() => { isCooldown = false; updateUI(currentStatus, document.getElementById("userName").value, document.getElementById("userSubject").value); }, 1500);
    }

    // 入室後かどうかで「入力フォーム」⇔「3Dビューア(自分を追従)」を切り替える
    function updateViewMode(status) {
      const formView = document.getElementById("formView");
      const viewerView = document.getElementById("viewerView");
      const iframe = document.getElementById("roomViewer");
      const inRoom = ["ENTER_REQUEST", "SEATED", "BREAK", "LEAVE_REQUEST"].includes(status);

      if (inRoom) {
        formView.classList.add("hidden");
        viewerView.classList.remove("hidden");
        const desiredSrc = `${STUDY_ROOM_3D_URL}?follow=${encodeURIComponent(userId)}&embed=1`;
        if (iframe.getAttribute("src") !== desiredSrc) {
          iframe.src = desiredSrc;
        }
      } else {
        formView.classList.remove("hidden");
        viewerView.classList.add("hidden");
        if (iframe.getAttribute("src")) iframe.removeAttribute("src");
      }
    }

    function updateUI(status, name, subject) {
      if (isCooldown) return;
      updateViewMode(status);

      const badge = document.getElementById("statusBadge");
      const userInfoLine = document.getElementById("userInfoLine");
      const displayName = document.getElementById("displayName");
      const displaySubject = document.getElementById("displaySubject");
      const btnEnter = document.getElementById("btnEnter");
      const btnBreak = document.getElementById("btnBreak");
      const btnLeave = document.getElementById("btnLeave");
      const btnEnterText = document.getElementById("btnEnterText");
      const btnBreakText = document.getElementById("btnBreakText");

      if (status === "ENTER_REQUEST") {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold bg-amber-500 text-white animate-pulse shrink-0";
        badge.innerHTML = `<span>⏳ 受付・座席移動中...</span>`;
        userInfoLine.classList.remove("hidden");
        displayName.innerText = name || "学習者";
        displaySubject.innerText = subject ? `教科: ${subject}` : "教科: 未設定";
        setElementsLock(true, true, true, true);

      } else if (status === "SEATED") {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-extrabold bg-emerald-500 text-white shrink-0";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span><span>🟢 入室中</span>`;
        userInfoLine.classList.remove("hidden");
        displayName.innerText = name || "学習者";
        displaySubject.innerText = subject ? `教科: ${subject}` : "教科: 未設定";
        btnEnter.disabled = true;
        btnEnter.className = "flex flex-col items-center justify-center gap-1 bg-slate-100 text-slate-300 border border-slate-200 font-bold py-2.5 px-1 text-xs cursor-not-allowed opacity-60";
        btnEnterText.innerText = "入室中";
        btnBreak.disabled = false;
        btnBreak.className = "flex flex-col items-center justify-center gap-1 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold py-2.5 px-1 text-xs transition";
        btnBreakText.innerText = "休憩する";
        btnLeave.disabled = false;
        btnLeave.className = "flex flex-col items-center justify-center gap-1 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold py-2.5 px-1 text-xs transition";
        setElementsLock(true, false, false, true);

      } else if (status === "BREAK") {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-extrabold bg-amber-500 text-white shrink-0";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-white animate-ping"></span><span>🟡 休憩中</span>`;
        userInfoLine.classList.remove("hidden");
        displayName.innerText = name || "学習者";
        displaySubject.innerText = "離席・休憩中";
        btnEnter.disabled = true;
        btnEnter.className = "flex flex-col items-center justify-center gap-1 bg-slate-100 text-slate-300 border border-slate-200 font-bold py-2.5 px-1 text-xs cursor-not-allowed opacity-60";
        btnEnterText.innerText = "入室中";
        btnBreak.disabled = false;
        btnBreak.className = "flex flex-col items-center justify-center gap-1 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-1 text-xs transition ring-2 ring-emerald-400";
        btnBreakText.innerText = "学習再開";
        btnLeave.disabled = false;
        btnLeave.className = "flex flex-col items-center justify-center gap-1 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold py-2.5 px-1 text-xs transition";
        setElementsLock(true, false, false, true);

      } else if (status === "LEAVE_REQUEST") {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold bg-rose-500 text-white animate-pulse shrink-0";
        badge.innerHTML = `<span>⏳ 退室中...</span>`;
        setElementsLock(true, true, true, true);

      } else {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold bg-slate-200 text-slate-600 shrink-0";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-400"></span><span>未入室</span>`;
        userInfoLine.classList.add("hidden");
        btnEnter.disabled = false;
        btnEnter.className = "flex flex-col items-center justify-center gap-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-2.5 px-1 text-xs transition";
        btnEnterText.innerText = "入室する";
        btnBreak.disabled = true;
        btnBreak.className = "flex flex-col items-center justify-center gap-1 bg-slate-100 text-slate-300 border border-slate-200 font-bold py-2.5 px-1 text-xs cursor-not-allowed opacity-60";
        btnBreakText.innerText = "休憩する";
        btnLeave.disabled = true;
        btnLeave.className = "flex flex-col items-center justify-center gap-1 bg-slate-100 text-slate-300 border border-slate-200 font-bold py-2.5 px-1 text-xs cursor-not-allowed opacity-60";
        setElementsLock(false, true, true, false);
      }
    }

    function setElementsLock(enterLock, breakLock, leaveLock, inputLock) {
      document.getElementById("btnEnter").disabled = enterLock;
      document.getElementById("btnBreak").disabled = breakLock;
      document.getElementById("btnLeave").disabled = leaveLock;
      document.getElementById("userName").disabled = inputLock;
      document.getElementById("userSubject").disabled = inputLock;
      document.getElementById("seatSelect").disabled = inputLock;
    }

    function handleEnter() {
      if (isCooldown) return;
      const name = document.getElementById("userName").value.trim();
      const subject = document.getElementById("userSubject").value.trim();
      const seatIndex = parseInt(document.getElementById("seatSelect").value);

      if (!name) return alert("ユーザーネームを入力してください");
      if (isNaN(seatIndex)) return alert("座席を選択してください");

      triggerCooldown();
      const today = getTodayStr();
      const updates = {};
      updates[`users/${userId}/name`] = name || "学習者";
      updates[`users/${userId}/subject`] = subject;
      updates[`users/${userId}/status`] = "ENTER_REQUEST";
      updates[`users/${userId}/seatIndex`] = seatIndex;
      updates[`users/${userId}/updatedAt`] = Date.now();
      updates[`users/${userId}/history/${today}`] = true;

      // 通信切断（タブ閉じ・ネットワーク断）時に自動的に「LEFT（退室）」へ更新するよう予約
      db.ref(`users/${userId}/status`).onDisconnect().set("LEFT");

      db.ref().update(updates);
    }

    function handleToggleBreak() {
      if (isCooldown) return;
      triggerCooldown();
      if (currentStatus === "SEATED") db.ref(`users/${userId}/status`).set("BREAK");
      else if (currentStatus === "BREAK") db.ref(`users/${userId}/status`).set("SEATED");
    }

    function handleLeave() {
      if (isCooldown) return;
      triggerCooldown();
      db.ref(`users/${userId}/status`).set("LEAVE_REQUEST");
    }
  </script>
</body>
</html>
